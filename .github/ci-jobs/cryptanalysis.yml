# Ready CI addition for the cryptanalysis gates.
#
# This is NOT an active workflow: it deliberately lives outside .github/workflows/.
# The automation account used for Agent-Mode pushes (GitHub App) does not have
# `workflows` permission on this repository (a push touching
# .github/workflows/ci.yml is rejected outright by GitHub), so a maintainer
# applies it with full access.
#
# To activate: append everything below the marker to the `jobs:` mapping of
# .github/workflows/ci.yml, at the same indentation as the existing `verify:`
# job. Nothing else needs to change.
#
# Why a separate job, and why it must not depend on the Zig build: an
# "independent cleanroom reproduction" that first requires trusting our own
# toolchain is not an independent reproduction. This job needs only gcc +
# python3.
#
# 2026-09-08 — the job was verified end-to-end locally (all steps, run-blocks
# executed literally under bash -e). Three latent defects of the ORIGINAL
# draft were fixed, two in code (committed) and one in the job block below:
#   1. Date drift (binder): the receipt's date came from the RUN record, and
#      the run record was ephemeral (/tmp). FIXED by versioning the canonical
#      record (docs/events/LIN_CRYPTO_256_REAL_RUN_RECORD.json) and re-binding
#      from it; the job below passes it explicitly via --run-json.
#   2. Date drift (restatement): --emit-corrections stamped date.today() on
#      the v1.1.0 file. FIXED in examples/verify_digest_binding.py: the
#      restatement now carries the ORIGINAL v1.0.0 event date, so the
#      emission is byte-identical on any day.
#   3. Exit-code trap: --emit-corrections keeps the audit verdict exit code
#      (1 while the v1.0.0 defects stand), which crashed the step under
#      set -e. FIXED in the job block below (tolerate 0/1, fail otherwise).
#
# NOTE on the audit step: verify_digest_binding.py is EXPECTED to exit
# non-zero while the superseded MAX-256 v1.0.0 receipt stands in the tree.
# That is a defect report, not a broken build; the step asserts the specific
# findings are still present so the audit cannot silently stop checking them.

# --- APPEND BELOW THE `jobs:` MAPPING IN .github/workflows/ci.yml ---

  # ------------------------------------------------------------------
  # Cryptanalysis gates. Deliberately independent of the Zig build: an
  # "independent reproduction" that requires trusting our toolchain is
  # not an independent reproduction. Needs only gcc + python3.
  #
  # The binder rebinds from the VERSIONED canonical run record
  # (docs/events/LIN_CRYPTO_256_REAL_RUN_RECORD.json), never from a
  # fresh /tmp run: wall-clock fields in a fresh record would make the
  # receipt drift every day.
  # ------------------------------------------------------------------
  cryptanalysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LIN-CRYPTO-256-REAL (attack -> re-encryption -> holdout -> cleanroom)
        run: make crypto256-real

      - name: Bind the receipt from the canonical record, then prove the binder is deterministic
        run: |
          python3 examples/bind_crypto256_real_receipt.py --run-json docs/events/LIN_CRYPTO_256_REAL_RUN_RECORD.json
          git diff --quiet docs/events/EVENT_LIN_CRYPTO_256_REAL.rulel || {
            echo "receipt is NOT reproducible: rebinding changed committed bytes"; git diff; exit 1; }

      - name: MAX-256 digest-binding audit (findings must be reported)
        run: |
          set +e
          python3 examples/verify_digest_binding.py > /tmp/audit.txt 2>&1
          rc=$?
          set -e
          cat /tmp/audit.txt
          test "$rc" -ne 0 || { echo "audit unexpectedly passed; the v1.0.0 defects were removed?"; exit 1; }
          for code in DIGEST_UNBOUND PREDICTED_REPORTED_AS_OBSERVED ALGORITHM_MISLABELLED OVERCLAIM_UNBREAKABLE ADVERSARIAL_TESTS_UNBOUND; do
            grep -q "$code" /tmp/audit.txt || { echo "audit lost finding $code"; exit 1; }
          done
          # the audited restatement must regenerate byte-identically.
          # (emit-corrections keeps the audit exit code: 0 = no findings,
          # 1 = findings present -- both are normal here, any other exit is
          # a crash and must fail the step)
          set +e
          python3 examples/verify_digest_binding.py --emit-corrections > /dev/null
          er=$?
          set -e
          test "$er" -le 1 || { echo "emit-corrections crashed (exit $er)"; exit 1; }
          git diff --quiet docs/events/EVENT_LIN_CRYPTO_MAX_256_FRONTIER_v1_1_0.rulel || {
            echo "v1.1.0 restatement is not reproducible"; git diff; exit 1; }
          # and the superseded v1.0.0 receipt must stay untouched, as history
          git diff --quiet docs/events/EVENT_LIN_CRYPTO_MAX_256_FRONTIER.rulel || {
            echo "v1.0.0 receipt was modified; supersede it, never rewrite it"; exit 1; }
